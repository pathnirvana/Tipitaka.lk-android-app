apply plugin: 'com.android.application'

android {
    namespace "lk.tipitaka.main"
    compileSdk 36
    defaultConfig {
        applicationId "lk.tipitaka.main"
        minSdk 24
        targetSdk 36 // Play requires API 36 (Android 16) for updates since Aug 2026
        versionCode 15
        versionName "3.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    assetPacks = [":dbassets"]
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
